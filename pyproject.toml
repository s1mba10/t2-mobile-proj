[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "t2-mobile"
version = "1.0.0"
description = "Учебный портал оператора t2: личный кабинет, тарифы и API, готовые к балансировке за reverse-proxy."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "t2-mobile lab" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "jinja2>=3.1.4",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "redis>=5.2.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.12",
  "email-validator>=2.2.0",
  "bcrypt>=4.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
  "aiosqlite>=0.20.0",
  "ruff>=0.7.0",
  "fakeredis>=2.26.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
