# Этапы 5-7: балансировка HTTP (L7), терминация TLS на балансировщике,
# панель статистики с базовой авторизацией.
# Связь с backend-серверами остаётся нешифрованной: сертификат живёт только здесь.

global
    log /dev/log local0
    maxconn 4096
    user haproxy
    group haproxy
    daemon
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256

defaults
    log     global
    mode    http
    option  httplog
    option  forwardfor
    option  http-server-close
    timeout connect 5s
    timeout client  60s
    timeout server  60s
    # Поток событий Server-Sent Events держит соединение открытым долго.
    timeout tunnel  1h

frontend ft_t2_http
    bind *:80
    bind *:443 ssl crt /etc/haproxy/certs/site.ivbo21.local.pem
    # Клиент работает только по HTTPS, обычный порт перенаправляет на защищённый.
    http-request redirect scheme https unless { ssl_fc }
    # Признак того, что шифрование снято именно здесь, backend об этом не знает.
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    # Имя backend-сервера, обработавшего запрос, видно в заголовке ответа.
    http-response set-header X-Served-By %[srv_name]
    default_backend bk_t2_http

backend bk_t2_http
    # Алгоритм меняется на leastconn или source при проверке пункта 5 задания.
    balance roundrobin
    # Активная проверка состояния: HAProxy сам опрашивает приложение.
    option httpchk
    http-check send meth GET uri /api/health
    http-check expect status 200
    server backend1 192.168.100.21:8000 check inter 2s fall 3 rise 2
    server backend2 192.168.100.22:8000 check inter 2s fall 3 rise 2

listen stats
    bind *:8043
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    stats auth admin:admin123
    stats admin if TRUE
