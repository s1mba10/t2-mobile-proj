# LoadBalancer #1 (shevkoplyas-lb.ivbo21.local) — роль MASTER.
# Узел удерживает виртуальный адрес, пока жив сам и жив процесс HAProxy.

global_defs {
    router_id lb1
    enable_script_security
    script_user root
}

# Скрипт выполняется каждые 2 секунды. Две неудачи подряд понижают приоритет
# на 60, то есть со 150 до 90, что ниже приоритета BACKUP (100),
# и виртуальный адрес уезжает на второй узел.
vrrp_script chk_haproxy {
    script "/etc/keepalived/check_haproxy.sh"
    interval 2
    timeout 2
    fall 2
    rise 2
    weight -60
}

vrrp_instance VI_T2 {
    state MASTER
    interface eth0
    virtual_router_id 51
    priority 150
    advert_int 1

    authentication {
        auth_type PASS
        auth_pass t2vrrp26
    }

    virtual_ipaddress {
        192.168.100.100/24 dev eth0 label eth0:vip
    }

    track_script {
        chk_haproxy
    }
}
