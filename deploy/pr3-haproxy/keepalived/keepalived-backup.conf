# LoadBalancer #2 (golubintsev-lb.ivbo21.local) — роль BACKUP.
# Узел поднимает виртуальный адрес, когда перестают приходить анонсы от MASTER.

global_defs {
    router_id lb2
    enable_script_security
    script_user root
}

# Скрипт выполняется каждые 2 секунды. Две неудачи подряд понижают приоритет
# на 60. На BACKUP это защищает от перехвата адреса при неработающем HAProxy.
#
vrrp_script chk_haproxy {
    script "/etc/keepalived/check_haproxy.sh"
    interval 2
    timeout 2
    fall 2
    rise 2
    weight -60
}

vrrp_instance VI_T2 {
    state BACKUP
    interface eth0
    virtual_router_id 51
    priority 100
    advert_int 1

    authentication {
        auth_type PASS
        auth_pass t2vrrp26
    }

    virtual_ipaddress {
        192.168.100.100/24 dev eth0 label eth0:vip
    }

    track_script {
        chk_haproxy
    }
}
