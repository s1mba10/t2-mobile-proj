# Стек мониторинга практической работы №6: Prometheus, node-exporter, Grafana.
#
#   docker stack deploy -c deploy/lab6/monitoring-stack.yml monitoring
#
# Файлы конфигурации раздаются через объекты config, а не через bind-mount:
# bind-mount требует, чтобы файл физически лежал на той ноде, где запустилась
# задача, а config Swarm сам доставляет содержимое на нужный узел.
version: "3.8"

configs:
  prometheus_config_v1:
    file: ./prometheus.yml
  prometheus_alerts_v1:
    file: ./alerts.yml
  grafana_datasource_v1:
    file: ./grafana/datasource.yml
  grafana_dashboards_v1:
    file: ./grafana/dashboards.yml
  grafana_overview_v1:
    file: ./grafana/t2-overview.json

services:
  prometheus:
    image: prom/prometheus:latest
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    configs:
      - source: prometheus_config_v1
        target: /etc/prometheus/prometheus.yml
      - source: prometheus_alerts_v1
        target: /etc/prometheus/alerts.yml
    volumes:
      - prometheus_data:/prometheus
    networks:
      - monitoring
      # Сеть стека из работы №4: без неё Prometheus не достучится
      # до метрик приложения по адресу tasks.t2_app.
      - t2net
    ports:
      - target: 9090
        published: ${PROM_PORT:-9090}
        protocol: tcp
        mode: ingress
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  node-exporter:
    image: prom/node-exporter:latest
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/host/root"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      # Без этих монтирований экспортер отдаёт метрики своего контейнера,
      # а не хозяйской машины, и цифры в дашборде не имеют смысла.
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    networks:
      - monitoring
    ports:
      # Режим host, а не ingress: иначе запрос к 192.168.xx.12:9100 мог бы
      # уйти через общую сеть на экспортер другой ноды, и метрики перепутались бы.
      - target: 9100
        published: 9100
        protocol: tcp
        mode: host
    deploy:
      mode: global
      restart_policy:
        condition: on-failure

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: "${GF_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GF_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    configs:
      - source: grafana_datasource_v1
        target: /etc/grafana/provisioning/datasources/datasource.yml
      - source: grafana_dashboards_v1
        target: /etc/grafana/provisioning/dashboards/dashboards.yml
      - source: grafana_overview_v1
        target: /var/lib/grafana/dashboards/t2-overview.json
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring
    ports:
      - target: 3000
        published: ${GF_PORT:-3000}
        protocol: tcp
        mode: ingress
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

networks:
  monitoring:
    driver: overlay
  t2net:
    external: true
    name: ${T2_NETWORK:-t2_t2net}

volumes:
  prometheus_data:
  grafana_data:
