---
- name: Установить Docker на веб-ноды и узел хранилища
  hosts: webservers:storage
  become: true

  tasks:
    - name: Установить зависимости apt
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true

    - name: Создать каталог для ключей репозиториев
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Загрузить GPG-ключ Docker
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Подключить репозиторий Docker
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
        filename: docker
        state: present

    - name: Установить Docker Engine и плагин compose
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Ограничить рост журналов контейнеров
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        mode: "0644"
        content: |
          {
            "log-driver": "json-file",
            "log-opts": { "max-size": "10m", "max-file": "3" }
          }
      notify: Перезапустить Docker

    - name: Включить и запустить Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

  handlers:
    - name: Перезапустить Docker
      ansible.builtin.service:
        name: docker
        state: restarted
