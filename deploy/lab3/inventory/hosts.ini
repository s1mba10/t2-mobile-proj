; Инвентарь практической работы №3.
; xx — номер подгруппы, заменить на выданный преподавателем.

[balancer]
node1 ansible_host=192.168.xx.11

[webservers]
node2 ansible_host=192.168.xx.12 nginx_weight=3
node3 ansible_host=192.168.xx.13 nginx_weight=1

; Хранилище намеренно живёт на узле балансировщика, а не на веб-нодах:
; иначе выключение node2 унесло бы вместе с собой PostgreSQL и Redis,
; и нарушилось бы ограничение №2 практической работы №2.
[storage]
node1 ansible_host=192.168.xx.11

[all:vars]
ansible_user=user
ansible_python_interpreter=/usr/bin/python3
