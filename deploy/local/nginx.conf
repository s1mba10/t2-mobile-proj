user nginx;
# Один воркер: у каждого воркера свой счётчик round-robin, и на нескольких
# воркерах чередование нод в коротком тесте выглядит рваным. Для демонстрации
# балансировки нужен предсказуемый порядок.
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    upstream t2_backend {
        # Локальная демонстрация round-robin для практической работы №2.
        # Расширенные схемы L4/L7, DNS и TLS — в лабораторной работе №3.
        server app-1:8000 max_fails=3 fail_timeout=15s;
        server app-2:8000 max_fails=3 fail_timeout=15s;
    }

    # Упавшая нода не должна держать клиента: две секунды на коннект, затем
    # запрос молча уходит на живой апстрим. Без этого первый запрос после
    # остановки ноды висел 60 секунд (дефолтный proxy_connect_timeout).
    proxy_connect_timeout 2s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 5s;

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://t2_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection close;
        }

        # Server-Sent Events: поток не буферизуем и не рвём по read timeout.
        location /api/v1/events {
            proxy_pass http://t2_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection close;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
        }
    }
}
