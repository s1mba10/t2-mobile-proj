user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    upstream t2_backend {
        # Локальная демонстрация round-robin для практической работы №2.
        # Расширенные схемы L4/L7, DNS и TLS — в лабораторной работе №3.
        server app-1:8000 max_fails=3 fail_timeout=15s;
        server app-2:8000 max_fails=3 fail_timeout=15s;
    }

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://t2_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection close;
        }
    }
}
